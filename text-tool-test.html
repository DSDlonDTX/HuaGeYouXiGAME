<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>文字工具 UI 测试</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #1a1d24;
    padding: 20px;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", sans-serif;
  }
  .menu-btn {
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.10em;
    padding: 4px 16px;
    border: 1px solid #b8bcc4;
    border-radius: 4px;
    cursor: pointer;
    color: #1f2430;
    background: linear-gradient(180deg, #f3f4f6 0%, #d7dae0 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), 0 2px 0 #9aa0a8;
  }
  .menu-btn:hover { background: linear-gradient(180deg, #ffca4a 0%, #f59f00 100%); border-color: #d97706; }
  .sb-slider { accent-color: #f59f00; vertical-align: middle; }
  .sb-slider-val {
    font-size: 11px; font-weight: 700; color: #1f2430;
    width: 30px; padding: 2px 0; text-align: center;
    border: 1px solid #b8bcc4; border-radius: 4px; background: #fff;
    vertical-align: middle;
  }

  /* ===== 文字工具面板：全部 inline-block 横排 ===== */
  .text-panel {
    display: inline-block;
    background: linear-gradient(180deg, #f4f5f7 0%, #e2e4e9 100%);
    border: 1px solid #b8bcc4;
    border-radius: 8px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 6px 16px rgba(0, 0, 0, 0.28);
    padding: 5px 10px;
    white-space: nowrap;
    width: 286px;
  }
  .text-panel > * { display: inline-block; vertical-align: middle; margin-right: 0px; }
  .text-panel > *:last-child { margin-right: 0; }

  /* ===== 通用下拉外壳（DDL/CBB 共用） ===== */
  .ddl, .cbb {
    position: relative;
    height: 26px;
    border: 1px solid #9aa0a8;
    border-radius: 3px;
    background: #fff;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.10);
    vertical-align: middle;
    cursor: pointer;
  }
  .ddl:hover, .cbb:hover, .ddl:focus-within, .cbb:focus-within { border-color: #f59f00; }

  /* 右侧独立箭头按钮（共用） */
  .ddl-arrow, .cbb-arrow {
    position: absolute; right: 0; top: 0;
    width: 20px; height: 100%;
    border: none;
    border-left: 1px solid #d7dae0;
    background: linear-gradient(180deg, #f3f4f6 0%, #e0e3e8 100%);
    border-radius: 0 2px 2px 0;
    cursor: pointer;
    padding: 0;
  }
  .ddl-arrow:hover, .cbb-arrow:hover {
    background: linear-gradient(180deg, #ffca4a 0%, #f59f00 100%);
  }
  .ddl-arrow::after, .cbb-arrow::after {
    content: '';
    position: absolute; left: 50%; top: 50%;
    width: 9px; height: 20px;
    transform: translate(-50%, -50%);
    background: url('texticons.png') no-repeat -742px 0;
  }

  /* DDL：显示区（自实现，不用原生 select） */
  .ddl { width: 140px; }
  .ddl-display {
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    font-size: 12px; color: #1f2430; pointer-events: none;
    max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* CBB：输入框 */
  .cbb { width: 70px; }
  .cbb input {
    width: 100%; height: 100%;
    box-sizing: border-box;
    border: none; outline: none;
    background: transparent;
    padding: 3px 24px 3px 8px;
    font-family: inherit; font-size: 12px; color: #1f2430;
  }

  /* 下拉列表（DDL/CBB 共用） */
  .ddl-list, .cbb-list {
    position: absolute; top: 27px; left: 0; right: 0;
    background: #fff;
    border: 1px solid #9aa0a8;
    border-radius: 3px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    list-style: none;
    margin: 0; padding: 2px 0;
    max-height: 120px;
    overflow-y: auto;
    z-index: 100;
    display: none;
  }
  .ddl-list.on, .cbb-list.on { display: block; }
  .ddl-list li, .cbb-list li {
    padding: 4px 10px;
    font-size: 12px; color: #1f2430;
    cursor: pointer;
  }
  .ddl-list li:hover, .cbb-list li:hover { background: #ffe8b3; }

  /* ===== 文字格式按钮组（粗/斜/下/删/对齐） ===== */
  .fmt-group {
    display: inline-flex;
    vertical-align: middle;
    gap: 2px;
    flex-wrap: wrap;
    align-items: center;
  }
  .fmt-break { flex-basis: 100%; height: 0; }
  /* 工具栏分隔线 */
  .fmt-sep {
    width: 2px;
    height: 20px;
    margin: 2px 4px 2px 3px;
    background: url('texticons.png') -181px 0;
  }
  /* 画布：PPT 风格任意文本框 */
  #tpCanvas {
    position: relative;
    width: 1000px;
    height: 900px;
    margin-top: 20px;
    background: #fff;
    border: 1px solid #b8bcc4;
    border-radius: 4px;
    overflow: hidden;
    cursor: default;
  }
  /* 单个文本框 */
  .tb {
    position: absolute;
    width: 120px;
    min-width: 40px;
    min-height: 24px;
    padding: 4px 6px;
    box-sizing: border-box;
    outline: none;
    cursor: move;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .tb.editing {
    border: 1px dashed #aaaaaa;
    cursor: text;
  }
  .tb.selected {
    border: 1px dashed #aaaaaa;
  }
  /* 8 个缩放点 */
  .tb-handle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: linear-gradient(180deg, #fbfbfc 0%, #e8eaee 100%);
    border: 1px solid #aaaaaa;
    border-radius: 2px;
    z-index: 10;
    box-shadow: inset 0 1px 0px rgba(255, 255, 255, 0.8), 0 0px 3px 2px rgba(0, 0, 0, 0.08);
  }
  .tb-handle.nw { top: -5px; left: -5px; cursor: nwse-resize; }
  .tb-handle.n  { top: -5px; left: 50%; margin-left: -5px; cursor: ns-resize; }
  .tb-handle.ne { top: -5px; right: -5px; cursor: nesw-resize; }
  .tb-handle.e  { top: 50%; right: -5px; margin-top: -5px; cursor: ew-resize; }
  .tb-handle.se { bottom: -5px; right: -5px; cursor: nwse-resize; }
  .tb-handle.s  { bottom: -5px; left: 50%; margin-left: -5px; cursor: ns-resize; }
  .tb-handle.sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
  .tb-handle.w  { top: 50%; left: -5px; margin-top: -5px; cursor: ew-resize; }
  .fmt-btn {
    width: 22px; height: 22px;
    border: 1px solid transparent;
    border-radius: 3px;
    background: transparent;
    cursor: pointer;
    padding: 0;
    font-size: 12px;
    color: #1f2430;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s, border-color 0.1s, box-shadow 0.1s;
  }
  .fmt-btn:hover { border-color: #f59f00; }
  /* 按下锁定：凹陷圆角质感 */
  .fmt-btn.active {
    background: #c9ccd2;
    border-color: #9aa0a8;
    box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.3);
  }
  /* 图标位（从 texticons.png 切片） */
  .fmt-btn .ico {
    width: 20px; height: 20px;
    background: url('texticons.png') no-repeat;
  }
  /* 文字颜色取色器 */
  .fmt-color {
    width: 19px;
    height: 19px;
    border: 3px ridge #d8d8d8;
    padding: 0;
    cursor: pointer;
    background: red;
  }
  .fmt-color::-webkit-color-swatch-wrapper { padding: 0; }
  .fmt-color::-webkit-color-swatch { border: none; }
</style>
</head>
<body>
  <div class="text-panel">
    <div class="fmt-group">
      <!-- 字体 DDL（启动时按系统可用字体动态填充） -->
      <div class="ddl" id="tpDdl">
        <div class="ddl-display" id="tpDdlText">黑体</div>
        <button class="ddl-arrow" id="tpDdlBtn" type="button"></button>
        <ul class="ddl-list" id="tpDdlList"></ul>
      </div>

      <!-- 字号 CBB -->
      <div class="cbb" id="tpCbb">
        <input id="tpInput" type="text" placeholder="字号" value="16px">
        <button class="cbb-arrow" id="tpCbbBtn" type="button"></button>
        <ul class="cbb-list" id="tpCbbList">
          <li>12px</li>
          <li>14px</li>
          <li>16px</li>
          <li>18px</li>
          <li>20px</li>
          <li>24px</li>
          <li>28px</li>
          <li>32px</li>
          <li>36px</li>
          <li>48px</li>
          <li>64px</li>
          <li>72px</li>
        </ul>
      </div>

      <input type="color" class="fmt-color" id="tpTextColor" value="#ff0000" title="文字颜色">
      <button class="fmt-btn" data-fmt="bold" title="粗体"><span class="ico" style="background-position:0 0"></span></button>
      <button class="fmt-btn" data-fmt="italic" title="斜体"><span class="ico" style="background-position:-60px 0"></span></button>

      <div class="fmt-break"></div>

      <button class="fmt-btn" data-fmt="underline" title="下划线"><span class="ico" style="background-position:-140px 0"></span></button>
      <button class="fmt-btn" data-fmt="strike" title="删除线"><span class="ico" style="background-position:-120px 0"></span></button>
      <div class="fmt-sep"></div>
      <button class="fmt-btn" data-fmt="left" title="居左"><span class="ico" style="background-position:-460px 0"></span></button>
      <button class="fmt-btn" data-fmt="center" title="居中"><span class="ico" style="background-position:-420px 0"></span></button>
      <button class="fmt-btn" data-fmt="right" title="居右"><span class="ico" style="background-position:-480px 0"></span></button>
      <button class="fmt-btn" data-fmt="justify" title="两端"><span class="ico" style="background-position:-440px 0"></span></button>

      <button class="menu-btn" id="tpCancel">取消</button>
      <button class="menu-btn" id="tpOk">确定</button>
    </div>
  </div>

  <!-- 测试文本框 -->
  <!-- 画布 -->
  <div id="tpCanvas"></div>

<script>
  // ===== DDL 自实现下拉 =====
  var ddl = document.getElementById('tpDdl');
  var ddlText = document.getElementById('tpDdlText');
  var ddlBtn = document.getElementById('tpDdlBtn');
  var ddlList = document.getElementById('tpDdlList');
  var input = document.getElementById('tpInput');
  var cbbList = document.getElementById('tpCbbList');
  var cbbBtn = document.getElementById('tpCbbBtn');

  function closeAll() {
    ddlList.classList.remove('on');
    cbbList.classList.remove('on');
  }
  // DDL：点显示区或箭头 → 展开
  ddl.addEventListener('click', function (e) {
    if (e.target.closest('.ddl-list')) return;
    var wasOpen = ddlList.classList.contains('on');
    closeAll();
    if (!wasOpen) ddlList.classList.add('on');
  });
  // ===== 预置字体列表：启动时检测系统可用，动态填充 DDL =====
  var PRESET_FONTS = [
    '黑体', '宋体', '楷体', '仿宋', '微软雅黑', '等线', '幼圆', '华文宋体', '华文楷体',
    'Times New Roman', 'Arial', 'Courier New', 'Verdana', 'Georgia', 'Consolas', 'Comic Sans MS'
  ];
  var availableFonts = PRESET_FONTS.filter(function (f) {
    try { return document.fonts.check('16px "' + f + '"'); } catch (e) { return false; }
  });
  if (!availableFonts.length) availableFonts = ['sans-serif'];
  availableFonts.forEach(function (f) {
    var li = document.createElement('li');
    li.textContent = f;
    li.style.fontFamily = '"' + f + '", sans-serif';
    ddlList.appendChild(li);
  });
  // 默认显示微软雅黑（没有则用第一个可用字体）
  var defaultFont = availableFonts.indexOf('微软雅黑') >= 0 ? '微软雅黑' : availableFonts[0];
  ddlText.textContent = defaultFont;
  // 居左对齐默认勾选（applyStyle 定义后再调）

  // DDL 选项：只更新 DDL 自己的显示，不联动 CBB
  ddlList.querySelectorAll('li').forEach(function (li) {
    li.addEventListener('click', function (e) {
      e.stopPropagation();
      ddlText.textContent = li.textContent;
      ddlList.classList.remove('on');
      applyStyle();
    });
  });

  // CBB：点箭头 → 展开
  cbbBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var wasOpen = cbbList.classList.contains('on');
    closeAll();
    if (!wasOpen) cbbList.classList.add('on');
  });
  // CBB 选项
  cbbList.querySelectorAll('li').forEach(function (li) {
    li.addEventListener('click', function () {
      input.value = li.textContent;
      cbbList.classList.remove('on');
    });
  });
  // 点外面收起
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.ddl') && !e.target.closest('.cbb')) closeAll();
  });

  // ===== 文本框组件 =====
  var canvas = document.getElementById('tpCanvas');
  var activeBox = null;  // 当前选中/编辑的文本框

  // 新建文本框
  function createTextBox(x, y) {
    var tb = document.createElement('div');
    tb.className = 'tb editing';
    tb.contentEditable = 'true';
    tb.style.left = x + 'px';
    tb.style.top = y + 'px';
    tb.style.minHeight = '30px';
    tb.innerHTML = '​';  // 零宽空格占位，防止空 contentEditable shrink
    canvas.appendChild(tb);
    void tb.offsetWidth;  // 强制重排，确保 width 生效
    applyBoxStyle(tb);
    // 加 8 个缩放点
    ['nw','n','ne','e','se','s','sw','w'].forEach(function (pos) {
      var h = document.createElement('div');
      h.className = 'tb-handle ' + pos;
      tb.appendChild(h);
    });
    activeBox = tb;
    tb.focus();
    // 选中零宽空格占位，用户打字直接替换
    var range = document.createRange();
    range.selectNodeContents(tb);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    return tb;
  }

  // 把当前工具栏样式应用到指定文本框（无参数则应用到 activeBox）
  function applyBoxStyle(tb) {
    tb = tb || activeBox;
    if (!tb) return;
    tb.style.fontFamily = '"' + ddlText.textContent + '", sans-serif';
    tb.style.fontSize = input.value || '16px';
    tb.style.color = document.getElementById('tpTextColor').value;
    var get = function (fmt) {
      var b = document.querySelector('.fmt-btn[data-fmt="' + fmt + '"]');
      return b && b.classList.contains('active');
    };
    tb.style.fontWeight = get('bold') ? 'bold' : 'normal';
    tb.style.fontStyle = get('italic') ? 'italic' : 'normal';
    var deco = [];
    if (get('underline')) deco.push('underline');
    if (get('strike')) deco.push('line-through');
    tb.style.textDecoration = deco.length ? deco.join(' ') : 'none';
    var alignMap = { left: 'left', center: 'center', right: 'right', justify: 'justify' };
    for (var k in alignMap) {
      if (get(k)) { tb.style.textAlign = alignMap[k]; break; }
    }
  }

  // 选中文本框：显示 8 个点
  function selectBox(tb) {
    if (activeBox === tb) return;  // 已是激活态，不重复 deselect（避免误删空文本框）
    deselectBox();
    activeBox = tb;
    tb.classList.add('selected');
    Array.prototype.forEach.call(tb.querySelectorAll('.tb-handle'), function (h) {
      h.style.display = 'block';
    });
  }
  // 取消选中（空文本框自动删除）
  function deselectBox() {
    if (!activeBox) return;
    var tb = activeBox;
    tb.classList.remove('selected', 'editing');
    tb.contentEditable = 'false';
    Array.prototype.forEach.call(tb.querySelectorAll('.tb-handle'), function (h) {
      h.style.display = 'none';
    });
    // 内容为空（只剩零宽空格占位）→ 删除该文本框
    var text = (tb.textContent || '').replace(/​/g, '').trim();
    if (!text) {
      if (tb.parentNode === canvas) canvas.removeChild(tb);
    }
    activeBox = null;
  }

  // 点画布空白：第一次取消选中，第二次新建文本框
  canvas.addEventListener('mousedown', function (e) {
    if (e.target !== canvas) return;
    if (activeBox) {
      deselectBox();
      return;
    }
    var rect = canvas.getBoundingClientRect();
    createTextBox(e.clientX - rect.left - 60, e.clientY - rect.top - 15);
  });

  // 文本框 mousedown：选中 + 开始移动/缩放
  canvas.addEventListener('mousedown', function (e) {
    var tb = e.target.closest('.tb');
    if (!tb) return;
    var handle = e.target.closest('.tb-handle');
    // 编辑中（contentEditable=true）且不是点 handle → 只定位光标，不拖动
    if (tb.contentEditable === 'true' && !handle) return;
    selectBox(tb);

    if (handle) {
      // ===== 8 点缩放 =====
      e.preventDefault();
      e.stopPropagation();
      var pos = Array.prototype.find.call(handle.classList, function (c) {
        return ['nw','n','ne','e','se','s','sw','w'].indexOf(c) >= 0;
      });
      var startX = e.clientX, startY = e.clientY;
      var startLeft = tb.offsetLeft, startTop = tb.offsetTop;
      var startW = tb.offsetWidth, startH = tb.offsetHeight;
      function onMove(ev) {
        var dx = ev.clientX - startX, dy = ev.clientY - startY;
        var w = startW, h = startH, l = startLeft, t = startTop;
        if (pos.indexOf('e') >= 0) w = Math.max(40, startW + dx);
        if (pos.indexOf('s') >= 0) h = Math.max(24, startH + dy);
        if (pos.indexOf('w') >= 0) { w = Math.max(40, startW - dx); l = startLeft + (startW - w); }
        if (pos.indexOf('n') >= 0) { h = Math.max(24, startH - dy); t = startTop + (startH - h); }
        tb.style.width = w + 'px';
        tb.style.height = h + 'px';
        tb.style.left = l + 'px';
        tb.style.top = t + 'px';
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      return;
    }

    // ===== 移动文本框 =====
    e.preventDefault();
    var offX = e.clientX - tb.getBoundingClientRect().left;
    var offY = e.clientY - tb.getBoundingClientRect().top;
    function onMove(ev) {
      var r = canvas.getBoundingClientRect();
      tb.style.left = (ev.clientX - r.left - offX) + 'px';
      tb.style.top = (ev.clientY - r.top - offY) + 'px';
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // 双击文本框 → 进入编辑，光标放到双击位置
  canvas.addEventListener('dblclick', function (e) {
    var tb = e.target.closest('.tb');
    if (!tb) return;
    tb.contentEditable = 'true';
    tb.classList.add('editing');
    // 光标放到双击点击处
    var range = document.caretRangeFromPoint(e.clientX, e.clientY);
    if (range) {
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } else {
      tb.focus();
    }
    // 编辑时隐藏缩放点
    Array.prototype.forEach.call(tb.querySelectorAll('.tb-handle'), function (h) {
      h.style.display = 'none';
    });
  });

  // 初始隐藏所有缩放点
  function hideAllHandles() {
    Array.prototype.forEach.call(canvas.querySelectorAll('.tb-handle'), function (h) {
      h.style.display = 'none';
    });
  }

  // ===== 旧的全文字应用（保留：工具栏改动时应用到当前激活文本框） =====
  var stage = null;  // 兼容旧代码
  function applyStyle() {
    if (!activeBox) return;
    var tb = activeBox;
    tb.style.fontFamily = '"' + ddlText.textContent + '", sans-serif';
    tb.style.fontSize = input.value || '16px';
    tb.style.color = document.getElementById('tpTextColor').value;
    var get = function (fmt) {
      var b = document.querySelector('.fmt-btn[data-fmt="' + fmt + '"]');
      return b && b.classList.contains('active');
    };
    tb.style.fontWeight = get('bold') ? 'bold' : 'normal';
    tb.style.fontStyle = get('italic') ? 'italic' : 'normal';
    var deco = [];
    if (get('underline')) deco.push('underline');
    if (get('strike')) deco.push('line-through');
    tb.style.textDecoration = deco.length ? deco.join(' ') : 'none';
    var alignMap = { left: 'left', center: 'center', right: 'right', justify: 'justify' };
    for (var k in alignMap) {
      if (get(k)) { tb.style.textAlign = alignMap[k]; break; }
    }
  }
  // 初始状态：居左对齐默认勾选
  document.querySelector('.fmt-btn[data-fmt="left"]').classList.add('active');

  // ===== 格式按钮：toggle 锁定 =====
  var ALIGN_FMTS = ['left', 'center', 'right', 'justify'];
  document.querySelectorAll('.fmt-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      var fmt = b.getAttribute('data-fmt');
      if (ALIGN_FMTS.indexOf(fmt) >= 0) {
        var wasOn = b.classList.contains('active');
        document.querySelectorAll('.fmt-btn').forEach(function (x) {
          if (ALIGN_FMTS.indexOf(x.getAttribute('data-fmt')) >= 0) x.classList.remove('active');
        });
        if (!wasOn) b.classList.add('active');
      } else {
        b.classList.toggle('active');
      }
      applyStyle();
    });
  });

  // 字号 CBB 选值 → 应用
  cbbList.querySelectorAll('li').forEach(function (li) {
    li.addEventListener('click', function () { applyStyle(); });
  });
  // 字号手动输入 → 应用
  input.addEventListener('input', function () { applyStyle(); });
  // 颜色取色器 → 应用
  document.getElementById('tpTextColor').addEventListener('input', function () { applyStyle(); });

  // 字号
  var size = document.getElementById('tpSize');
  var sizeVal = document.getElementById('tpSizeVal');
  size.addEventListener('input', function () { sizeVal.value = size.value; });
  sizeVal.addEventListener('input', function () {
    var v = Math.max(12, Math.min(120, parseInt(sizeVal.value) || 24));
    size.value = v;
  });
</script>
</body>
</html>

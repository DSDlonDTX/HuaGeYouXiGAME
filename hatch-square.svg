<?xml version="1.0" encoding="UTF-8"?>
<!--
  圆角方形 + 斜线镂空 图标

  · 外轮廓：64 网格上的圆角方形，圆角半径 rx = 12（= 0.188 × 边长）
  · 斜线：45° 的 "/" 方向；垂直节距 8.2（= 0.128 × 边长），缝宽 3.42（缝占空比 0.418）
    → 整个方形上共 11 条缝
  · 镂空 = 用 mask 把斜缝**挖成透明**（不是画白色描边），
    所以放到任何背景（浅色工具栏 / 深色工具栏 / 透明 app 图标）都正确
  · 颜色走 currentColor：内联使用时跟随 CSS color；当 <img src="..."> 用时默认渲染为黑

  比例来自对参考图（781×787 截图）的**实测**，不是眼估：
    圆角 r/边长 = 0.188 —— 由「闭合面积反解」与「对角内缩反解」两条独立路径互验；
      且两条量法都先在已知 r 的合成图上**标定过偏差**（照着边界直接读会偏 40%，实测 85 vs 真值 138）
    节距 p/边长 = 0.1286、缝占空比 = 0.4176 —— 由相位直方图的"空段"与墨迹面积占比给出
    参考图本身的条纹并不规整（墨条宽在 50~115 之间乱跳、缝却稳定 56~66），这里按**规整版**复刻
    角度：参考图实测 42.2°~43.5°（三种量法一致），此处取 45° —— 斜线图标的规范角度，
      且在整数网格上光栅化更干净；想复刻原角度把下面每条 <line> 的坐标换成对应斜率的即可

  想调比例，只需改这几处：
    圆角大小 → <rect rx>
    条纹疏密 → <mask> 里 stroke-width 与各条 <line> 的 c（直线 x + y = c，相邻相差 11.60）
    条纹粗细 → **只**改 stroke-width（缝宽）；c 的间距 = 节距 × √2，动了密度也跟着变
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="hatch-square-title">
  <title id="hatch-square-title">圆角方形斜线镂空</title>

  <defs>
    <!-- 遮罩规则：白 = 保留，黑 = 挖掉。
         白色区域就是圆角方形本身，黑色斜线把缝挖穿 → 得到"圆角方形里铺满斜线镂空"。 -->
    <mask id="hatch-square-slits" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" rx="12" fill="#fff"/>
      <g stroke="#000" stroke-width="3.42" stroke-linecap="butt" fill="none">
        <line x1="-2.83" y1="8.85" x2="8.85" y2="-2.83"/>
        <line x1="-2.83" y1="20.44" x2="20.44" y2="-2.83"/>
        <line x1="-2.83" y1="32.04" x2="32.04" y2="-2.83"/>
        <line x1="-2.83" y1="43.64" x2="43.64" y2="-2.83"/>
        <line x1="-2.83" y1="55.23" x2="55.23" y2="-2.83"/>
        <line x1="-2.83" y1="66.83" x2="66.83" y2="-2.83"/>
        <line x1="8.77" y1="66.83" x2="66.83" y2="8.77"/>
        <line x1="20.36" y1="66.83" x2="66.83" y2="20.36"/>
        <line x1="31.96" y1="66.83" x2="66.83" y2="31.96"/>
        <line x1="43.56" y1="66.83" x2="66.83" y2="43.56"/>
        <line x1="55.15" y1="66.83" x2="66.83" y2="55.15"/>
      </g>
    </mask>
  </defs>

  <rect width="64" height="64" rx="12" fill="currentColor" mask="url(#hatch-square-slits)"/>
</svg>

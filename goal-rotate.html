<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>终点元件测试</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%232cff2c'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f6f8;
  }
  .goal {
    width: 96px;
    height: 96px;
    /* 顺时针持续旋转：1 秒转一周（360°） */
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
</style>
</head>
<body>
  <img class="goal" src="终点.svg" alt="终点" draggable="false">
</body>
</html>
